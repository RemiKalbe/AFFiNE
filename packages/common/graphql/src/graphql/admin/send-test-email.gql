mutation sendTestEmail($host: String!, $port: Int!, $sender: String!, $username: String!, $password: String!, $ignoreTLS: Boolean!, $secure: Boolean!, $requireTLS: Boolean!, $senderName: String, $envelopeFrom: String) {
  sendTestEmail(config: {
    host: $host,
    port: $port,
    sender: $sender,
    username: $username,
    password: $password,
    ignoreTLS: $ignoreTLS,
    secure: $secure,
    requireTLS: $requireTLS,
    senderName: $senderName,
    envelopeFrom: $envelopeFrom,
  })
}